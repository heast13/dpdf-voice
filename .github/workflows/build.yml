name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache assets
        uses: actions/cache@v4
        with:
          path: assets
          key: assets-${{ hashFiles('scripts/fetch-assets.ps1') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Fetch assets
        shell: pwsh
        run: ./scripts/fetch-assets.ps1

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: End-to-end check
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist -Directory | Select-Object -First 1
          python scripts/ci-check.py (Join-Path $stage.FullName 'dpdf-voice') target/release

      - uses: actions/upload-artifact@v4
        with:
          name: dpdf-voice-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dpdf-voice-windows-x64
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
